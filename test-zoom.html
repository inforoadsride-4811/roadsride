<!DOCTYPE html>
<html>
<style>
.container {
  width: 500px;
  height: 500px;
  overflow: hidden;
  border: 1px solid red;
  position: relative;
}
.inner {
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, #f00 0%, #0f0 50%, #00f 100%);
  transform-origin: 50% 50%;
  /* test clamping at y=20%. clampedY = 20%. translate = 50 - 20 = 30% */
  transform: scale(2.5) translate(0%, 30%);
}
.center-marker {
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 10px;
  background: black;
  transform: translate(-50%, -50%);
}
</style>
<body>
<div class="container">
  <div class="inner"></div>
  <div class="center-marker"></div>
</div>
</body>
</html>
